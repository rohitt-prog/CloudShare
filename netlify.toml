# Netlify Configuration for CloudShare
# Baseline commit: 50c16f5d5a2d98f4a8a9e38c523e114ece55ffce

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Authoritative Single Page Application Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Baseline Security Headers & General SPA Route Revalidation
# Applies to /, /dashboard, /settings, /login, /register, and all rewritten routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=0, must-revalidate"

# Caching Policy: Immutable Hashed Static Assets
# Positioned after /* so Cache-Control overrides the general revalidation policy for hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Caching Policy: Application Entry Point (Direct /index.html requests)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
